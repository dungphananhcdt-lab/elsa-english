<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="40%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="gemBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1F5FE" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>
  </defs>

  <!-- Crown Base Arc -->
  <path d="M 25 155 Q 100 170 175 155 L 180 140 Q 100 155 20 140 Z" fill="url(#goldCrown)" stroke="#FF6F00" stroke-width="1.5" />
  
  <!-- Crown Peaks -->
  <path d="M 20 140 L 35 80 L 65 125 L 100 45 L 135 125 L 165 80 L 180 140 Q 100 155 20 140 Z" fill="url(#goldCrown)" stroke="#FF6F00" stroke-width="2" />
  
  <!-- Central Ice Gem (Elsa Heart Gem) -->
  <polygon points="100,75 112,95 100,120 88,95" fill="url(#gemBlue)" stroke="#FFF" stroke-width="2" />
  
  <!-- Side Gems -->
  <circle cx="35" cy="80" r="7" fill="url(#gemBlue)" stroke="#FFF" stroke-width="1.5" />
  <circle cx="165" cy="80" r="7" fill="url(#gemBlue)" stroke="#FFF" stroke-width="1.5" />
  <circle cx="100" cy="45" r="9" fill="url(#gemBlue)" stroke="#FFF" stroke-width="2" />
  
  <!-- Base Pearls -->
  <circle cx="50" cy="150" r="5" fill="#FFF" />
  <circle cx="75" cy="153" r="5" fill="#FFF" />
  <circle cx="100" cy="155" r="6" fill="#FFF" />
  <circle cx="125" cy="153" r="5" fill="#FFF" />
  <circle cx="150" cy="150" r="5" fill="#FFF" />
</svg>

