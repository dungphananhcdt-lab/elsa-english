  <path d="M 120 185 Q 95 215 90 235 Q 98 240 108 232 Q 122 215 125 190 Z" fill="#72EFDD" />
  <path d="M 180 185 Q 205 215 210 235 Q 202 240 192 232 Q 178 215 175 190 Z" fill="#72EFDD" />
  
  <!-- Hands -->
  <circle cx="92" cy="237" r="7" fill="#FFE5D9" />
  <circle cx="208" cy="237" r="7" fill="#FFE5D9" />

