<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="100%" height="100%">
  <defs>
    <linearGradient id="annaHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C26A3B" />
      <stop offset="50%" stop-color="#9C441D" />
      <stop offset="100%" stop-color="#732B0D" />
    </linearGradient>
    <linearGradient id="annaDress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B4965" />
      <stop offset="50%" stop-color="#2B2D42" />
      <stop offset="100%" stop-color="#161B33" />
    </linearGradient>
    <linearGradient id="annaCape" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D90429" />
      <stop offset="100%" stop-color="#941B3C" />
    </linearGradient>
  </defs>

  <!-- Magenta Cape -->
  <path d="M 100 180 C 60 230 50 310 60 345 C 100 335 140 340 150 340 C 160 340 200 335 240 345 C 250 310 240 230 200 180 Z" fill="url(#annaCape)" />

  <!-- Dress Skirt -->
  <path d="M 115 220 L 90 345 C 130 355 170 355 210 345 L 185 220 Z" fill="url(#annaDress)" />
  <!-- Floral embroidery detail -->
  <circle cx="150" cy="320" r="5" fill="#EF233C" />
  <circle cx="135" cy="325" r="4" fill="#64DFDF" />
  <circle cx="165" cy="325" r="4" fill="#64DFDF" />

  <!-- Bodice -->
  <path d="M 120 180 L 115 225 L 185 225 L 180 180 Z" fill="#1B1B1E" />
  <path d="M 130 185 Q 150 200 170 185" stroke="#E9C46A" stroke-width="3" fill="none" />
  <path d="M 150 190 L 150 220" stroke="#E9C46A" stroke-width="2.5" />

