<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="100%" height="100%">
  <defs>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="60%" stop-color="#FCEAB3" />
      <stop offset="100%" stop-color="#EED596" />
    </linearGradient>
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#AEE7FF" />
      <stop offset="40%" stop-color="#5CC8F5" />
      <stop offset="100%" stop-color="#1E9ED8" />
    </linearGradient>
    <linearGradient id="capeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1F7FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9CE0FF" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="iceGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#80E0FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sparkle aura -->
  <g opacity="0.6">
    <polygon points="40,90 44,98 52,102 44,106 40,114 36,106 28,102 36,98" fill="#FFF" />
    <polygon points="260,110 263,116 270,119 263,122 260,128 257,122 250,119 257,116" fill="#AEE7FF" />
    <polygon points="70,220 73,225 80,227 73,229 70,235 67,229 60,227 67,225" fill="#E1F7FF" />
    <polygon points="230,240 233,245 240,247 233,249 230,255 227,249 220,247 227,245" fill="#FFF" />
  </g>

  <!-- Cape -->
  <path d="M 100 190 C 60 250 40 320 50 350 C 90 340 130 345 150 345 C 170 345 210 340 250 350 C 260 320 240 250 200 190 Z" fill="url(#capeGrad)" />

  <!-- Dress Body -->
  <path d="M 115 180 L 95 340 C 130 350 170 350 205 340 L 185 180 Z" fill="url(#dressGrad)" />
  
  <!-- Bodice Sparkles -->
  <path d="M 118 180 Q 150 200 182 180 L 185 225 Q 150 240 115 225 Z" fill="#8CE0FA" opacity="0.8" />
  <circle cx="150" cy="205" r="3" fill="#FFF" filter="url(#glow)" />
  <circle cx="135" cy="215" r="2.5" fill="#FFF" />
  <circle cx="165" cy="215" r="2.5" fill="#FFF" />

  <!-- Arms / Sleeves -->
  <path d="M 115 185 Q 90 220 85 240 Q 95 245 105 235 Q 120 215 125 190 Z" fill="#D3F2FF" opacity="0.85" />
  <path d="M 185 185 Q 210 220 215 240 Q 205 245 195 235 Q 180 215 175 190 Z" fill="#D3F2FF" opacity="0.85" />
  
  <!-- Hands -->
  <circle cx="86" cy="242" r="7" fill="#FFE5D9" />
  <circle cx="214" cy="242" r="7" fill="#FFE5D9" />
  
  <!-- Magic in hand -->
  <g transform="translate(214, 238)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#FFF" filter="url(#glow)" />
    <circle cx="0" cy="0" r="4" fill="#80E0FF" />
  </g>

  <!-- Elsa Blonde Braid -->
  <path d="M 190 140 C 220 180 210 260 175 285 C 168 290 162 285 165 275 C 190 245 195 185 170 150 Z" fill="url(#hairGrad)" stroke="#E5C77A" stroke-width="2" />

  <!-- Head / Face -->
  <circle cx="150" cy="135" r="50" fill="#FFEAE0" />
  <path d="M 115 130 C 115 175 150 185 150 185 C 150 185 185 175 185 130 Z" fill="#FFEAE0" />

  <!-- Cute Big Cartoon Eyes -->
  <!-- Left Eye -->
  <ellipse cx="132" cy="135" rx="12" ry="14" fill="#FFF" />
  <ellipse cx="134" cy="135" rx="8" ry="10" fill="#2E86AB" />
  <circle cx="135" cy="135" r="5" fill="#1C3F5E" />
  <circle cx="132" cy="131" r="3" fill="#FFF" />
  <circle cx="137" cy="138" r="1.5" fill="#FFF" />
  <path d="M 118 123 Q 132 118 145 125" stroke="#4A3423" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 120 126 Q 133 121 144 126" stroke="#8A4A70" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Right Eye -->
  <ellipse cx="168" cy="135" rx="12" ry="14" fill="#FFF" />
  <ellipse cx="166" cy="135" rx="8" ry="10" fill="#2E86AB" />
  <circle cx="165" cy="135" r="5" fill="#1C3F5E" />
  <circle cx="164" cy="131" r="3" fill="#FFF" />
  <circle cx="169" cy="138" r="1.5" fill="#FFF" />
  <path d="M 155 125 Q 168 118 182 123" stroke="#4A3423" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 156 126 Q 167 121 180 126" stroke="#8A4A70" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Rosy Cheeks -->
  <circle cx="120" cy="150" r="9" fill="#FF9EAA" opacity="0.45" />
  <circle cx="180" cy="150" r="9" fill="#FF9EAA" opacity="0.45" />

  <!-- Cute Smile -->
  <path d="M 142 155 Q 150 163 158 155" stroke="#C84B68" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 143 156 Q 150 166 157 156" fill="#FF6B8B" opacity="0.6" />

  <!-- Front Hair & Tiara -->
  <path d="M 100 130 C 95 85 140 65 150 65 C 160 65 205 85 200 130 C 185 95 160 100 150 108 C 140 100 115 95 100 130 Z" fill="url(#hairGrad)" stroke="#E5C77A" stroke-width="1.5" />
  <!-- Hair bangs strands -->
  <path d="M 150 65 Q 130 90 120 115" stroke="#FCEAB3" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 155 65 Q 165 92 178 115" stroke="#FCEAB3" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Ice Crystal Tiara -->
  <polygon points="150,55 156,72 166,74 158,80 160,90 150,84 140,90 142,80 134,74 144,72" fill="url(#iceGlow)" stroke="#5CC8F5" stroke-width="1.5" filter="url(#glow)" />
  <circle cx="150" cy="75" r="3" fill="#FFF" />
</svg>

