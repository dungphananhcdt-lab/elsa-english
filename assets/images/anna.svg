  <!-- Left Braid -->
  <path d="M 110 150 C 95 190 90 240 100 275 C 105 280 110 275 108 268 C 102 240 108 190 120 155 Z" fill="url(#annaHair)" stroke="#732B0D" stroke-width="1.5" />
  <!-- Right Braid -->
  <path d="M 190 150 C 205 190 210 240 200 275 C 195 280 190 275 192 268 C 198 240 192 190 180 155 Z" fill="url(#annaHair)" stroke="#732B0D" stroke-width="1.5" />
  <!-- White hair streak on right side -->
  <path d="M 185 145 C 195 180 202 230 196 265" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.9" />

  <!-- Head / Face -->
  <circle cx="150" cy="135" r="50" fill="#FFEAE0" />
  <path d="M 115 130 C 115 175 150 185 150 185 C 150 185 185 175 185 130 Z" fill="#FFEAE0" />

  <!-- Big Green/Hazel Eyes -->
  <!-- Left Eye -->
  <ellipse cx="132" cy="135" rx="12" ry="14" fill="#FFF" />
  <ellipse cx="134" cy="135" rx="8" ry="10" fill="#2A9D8F" />
  <circle cx="135" cy="135" r="5" fill="#1C3F5E" />
  <circle cx="132" cy="131" r="3" fill="#FFF" />
  <circle cx="137" cy="138" r="1.5" fill="#FFF" />
  <path d="M 118 123 Q 132 118 145 125" stroke="#4A3423" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Right Eye -->
  <ellipse cx="168" cy="135" rx="12" ry="14" fill="#FFF" />
  <ellipse cx="166" cy="135" rx="8" ry="10" fill="#2A9D8F" />
  <circle cx="165" cy="135" r="5" fill="#1C3F5E" />
  <circle cx="164" cy="131" r="3" fill="#FFF" />
  <circle cx="169" cy="138" r="1.5" fill="#FFF" />
  <path d="M 155 125 Q 168 118 182 123" stroke="#4A3423" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Cute Freckles! -->
  <circle cx="126" cy="148" r="1.5" fill="#C26A3B" />
  <circle cx="131" cy="151" r="1.5" fill="#C26A3B" />
  <circle cx="136" cy="149" r="1.5" fill="#C26A3B" />
  <circle cx="164" cy="149" r="1.5" fill="#C26A3B" />
  <circle cx="169" cy="151" r="1.5" fill="#C26A3B" />
  <circle cx="174" cy="148" r="1.5" fill="#C26A3B" />

  <!-- Rosy Cheeks -->
  <circle cx="120" cy="150" r="9" fill="#FF9EAA" opacity="0.5" />
  <circle cx="180" cy="150" r="9" fill="#FF9EAA" opacity="0.5" />

  <!-- Cheerful Smile -->
  <path d="M 140 155 Q 150 167 160 155" stroke="#C84B68" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Anna Hair Bangs & Cap -->
  <path d="M 102 125 C 98 80 140 68 150 68 C 160 68 202 80 198 125 C 185 92 165 96 150 105 C 135 96 115 92 102 125 Z" fill="url(#annaHair)" stroke="#732B0D" stroke-width="1.5" />
