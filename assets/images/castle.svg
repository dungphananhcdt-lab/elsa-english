<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="100%" height="100%">
  <defs>
    <linearGradient id="iceGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1F5FE" />
      <stop offset="50%" stop-color="#81D4FA" />
      <stop offset="100%" stop-color="#29B6F6" />
    </linearGradient>
    <linearGradient id="iceGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#B3E5FC" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>
    <linearGradient id="crystalDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7" />
      <stop offset="100%" stop-color="#0277BD" />
    </linearGradient>
    <filter id="glowCastle">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ice Mountain Base -->
  <polygon points="20,350 70,280 150,300 230,270 280,350" fill="url(#crystalDeep)" opacity="0.6" />
  <polygon points="50,350 100,290 150,310 200,285 250,350" fill="url(#iceGrad1)" opacity="0.8" />

  <!-- Side Spire Left -->
  <polygon points="70,290 60,180 85,120 110,180 100,290" fill="url(#iceGrad1)" stroke="#E1F5FE" stroke-width="1.5" />
  <polygon points="85,120 75,180 85,290" fill="url(#iceGrad2)" opacity="0.8" />

  <!-- Side Spire Right -->
  <polygon points="190,290 200,180 215,120 240,180 230,290" fill="url(#iceGrad1)" stroke="#E1F5FE" stroke-width="1.5" />
  <polygon points="215,120 225,180 215,290" fill="url(#iceGrad2)" opacity="0.8" />

  <!-- Central Great Tower -->
  <polygon points="110,310 115,140 150,40 185,140 190,310" fill="url(#iceGrad1)" stroke="#FFF" stroke-width="2" filter="url(#glowCastle)" />
  <!-- Central Crystal Facets -->
  <polygon points="150,40 130,140 150,310" fill="url(#iceGrad2)" />
  <polygon points="150,40 170,140 150,310" fill="url(#crystalDeep)" opacity="0.5" />

  <!-- Magic Balcony / Windows -->
  <polygon points="135,170 150,150 165,170 160,200 140,200" fill="#E0F7FA" stroke="#FFF" stroke-width="1.5" />
  <polygon points="140,240 150,225 160,240 158,270 142,270" fill="#E0F7FA" stroke="#FFF" stroke-width="1.5" />

  <!-- Top Star Crystal -->
  <polygon points="150,25 154,36 165,40 154,44 150,55 146,44 135,40 146,36" fill="#FFF" filter="url(#glowCastle)" />

  <!-- Floating Sparkles -->
  <circle cx="90" cy="110" r="3" fill="#FFF" />
  <circle cx="210" cy="110" r="3" fill="#FFF" />
  <circle cx="60" cy="200" r="2.5" fill="#B3E5FC" />
  <circle cx="240" cy="200" r="2.5" fill="#B3E5FC" />
  <circle cx="150" cy="90" r="2.5" fill="#FFF" />
</svg>

