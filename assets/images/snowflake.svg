<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="snowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g stroke="#80D8FF" stroke-width="4.5" stroke-linecap="round" filter="url(#snowGlow)">
    <!-- 6 main branches -->
    <line x1="100" y1="20" x2="100" y2="180" stroke="#E1F5FE" stroke-width="6" />
    <line x1="30" y1="60" x2="170" y2="140" stroke="#E1F5FE" stroke-width="6" />
    <line x1="30" y1="140" x2="170" y2="60" stroke="#E1F5FE" stroke-width="6" />
    
    <!-- Chevrons / crystals on vertical branch -->
    <path d="M 85 45 L 100 60 L 115 45 M 85 155 L 100 140 L 115 155" fill="none" />
    <path d="M 90 30 L 100 40 L 110 30 M 90 170 L 100 160 L 110 170" fill="none" />

    <!-- Chevrons on diagonal 1 -->
    <path d="M 45 75 L 60 70 L 65 85 M 155 125 L 140 130 L 135 115" fill="none" />
    <path d="M 35 63 L 45 60 L 50 72 M 165 137 L 155 140 L 150 128" fill="none" />

    <!-- Chevrons on diagonal 2 -->
    <path d="M 45 125 L 60 130 L 65 115 M 155 75 L 140 70 L 135 85" fill="none" />
    <path d="M 35 137 L 45 140 L 50 128 M 165 63 L 155 60 L 150 72" fill="none" />
  </g>
  <circle cx="100" cy="100" r="14" fill="#FFFFFF" stroke="#00B0FF" stroke-width="3" />
  <circle cx="100" cy="100" r="6" fill="#80D8FF" />
</svg>

